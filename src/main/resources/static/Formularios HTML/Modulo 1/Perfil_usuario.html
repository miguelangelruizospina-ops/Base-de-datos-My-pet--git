<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Perfiles - My Pet</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        /* ENCABEZADO */

        .encabezado {
            background: linear-gradient(135deg, #ff8a3d, #ffb347);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .logo {
            font-size: 45px;
        }

        .encabezado h1 {
            font-size: 32px;
            margin: 8px 0;
        }

        .encabezado p {
            font-size: 15px;
        }

        /* CONTENIDO */

        .contenido {
            background: white;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .seccion {
            margin-bottom: 40px;
        }

        /* TARJETAS */

        .tabla-perfil {
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 25px;
            background: #fff;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 35px;
        }

        .tabla-titulo {
            font-size: 20px;
            color: #ff8a3d;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
        }

        /* FORMULARIOS */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo.completo {
            grid-column: 1 / 3;
        }

        .campo label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .campo input,
        .campo textarea,
        .campo select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background-color: #fafafa;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: #ff8a3d;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.12);
        }

        .campo textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* BOTONES */

        .botones {
            grid-column: 1 / 3;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-crear {
            background: #ff8a3d;
            color: white;
        }

        .btn-actualizar {
            background: #3498db;
            color: white;
        }

        .btn-eliminar {
            background: #e74c3c;
            color: white;
        }

        .btn-limpiar {
            background: #777;
            color: white;
        }

        .btn-listar {
            background: #27ae60;
            color: white;
        }

        /* MENSAJES */

        .mensaje {
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* TABLA */

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #ff8a3d;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 11px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fff7ed;
        }

        /* RESULTADO DE BUSQUEDA */

        .resultado {
            margin-top: 20px;
        }

        .tarjeta-resultado {
            background: #fff7ed;
            border: 1px solid #f1f1f1;
            border-radius: 12px;
            padding: 20px;
        }

        .tarjeta-resultado h3 {
            color: #ff8a3d;
            margin-bottom: 15px;
        }

        .dato {
            margin-bottom: 8px;
        }

        /* PIE */

        .pie {
            background: #fafafa;
            padding: 18px;
            text-align: center;
            color: #777;
            border-radius: 0 0 20px 20px;
        }

        /* CELULARES */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo.completo {
                grid-column: 1;
            }

            .botones {
                grid-column: 1;
            }

            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <div class="encabezado">

        <div class="logo">
            🐾
        </div>

        <!-- =====================================================
             CREAR PERFIL

                            maxlength="20"

                    </div>


                    <div class="campo">

                        <label for="crearCiudad">
                            Ciudad

                        <input
                            type="text"
                            id="crearCiudad"
                            maxlength="100"
                            placeholder="Ejemplo: Medellín"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="crearGenero">
                            Género
                        </label>

                        <select
                            id="crearGenero"
                            required

                            <option value="">

                            <option value="Masculino">

                            <option value="Femenino">

                                Otro

                    <div class="campo">

                        <label for="crearFechaNacimiento">

                        </label>

                        <input
                            type="date"

                    <div class="campo completo">

                        <label for="crearBiografia">

                        <textarea
                            id="crearBiografia"
                            maxlength="300"
                            placeholder="Escriba una breve descripción..."
                            required
                        ></textarea>

                    </div>


                    <div class="botones">

                        <button
                            type="submit"
                            class="btn-crear"
                        >
                            Crear perfil
                        </button>


                        <button
                            type="button"
                            class="btn-limpiar"
                            onclick="limpiarCrear()"
                        >
                            Limpiar
                        </button>

                    </div>

                </form>


                <p
                    id="mensajeCrear"
                    class="mensaje"
                ></p>

            </div>

        </section>



        <!-- =====================================================
             LISTAR TODOS LOS PERFILES
        ====================================================== -->

        <section class="seccion">

            <div class="tabla-perfil">

                <h2 class="tabla-titulo">
                    Lista de perfiles de usuario
                </h2>


                <button
                    type="button"
                    class="btn-listar"
                    onclick="listarPerfiles()"
                >
                    Listar todos los perfiles
                </button>


                <div
                    id="contenedorLista"
                    class="tabla-contenedor"
                ></div>

            </div>

        </section>



        <!-- =====================================================
             BUSCAR POR ID
        ====================================================== -->

        <section class="seccion">

            <div class="tabla-perfil">

                <h2 class="tabla-titulo">
                    Buscar perfil por ID
                </h2>


                <form
                    id="formBuscarPerfil"
                    class="formulario"
                >


                    <div class="campo">

                        <label for="buscarIdPerfil">
                            ID del perfil
                        </label>

                        <input
                            type="number"
                            id="buscarIdPerfil"
                            min="1"
                            placeholder="Ingrese el ID del perfil"
                            required
                        >

                    </div>


                    <div class="botones">

                        <button
                            type="submit"
                            class="btn-actualizar"
                        >
                              Buscar perfil
                        </button>


                        <button
                            type="button"
                            class="btn-limpiar"
                            onclick="limpiarBuscar()"
                        >
                            Limpiar
                        </button>

                    </div>

                </form>


                <div
                    id="resultadoPerfil"
                    class="resultado"
                ></div>

            </div>

        </section>



        <!-- =====================================================
             ACTUALIZAR PERFIL
        ====================================================== -->

        <section class="seccion">

            <div class="tabla-perfil">

                <h2 class="tabla-titulo">
                    Actualizar perfil de usuario
                </h2>


                <form
                    id="formActualizarPerfil"
                    class="formulario"
                >


                    <div class="campo">

                        <label for="actualizarIdPerfil">
                            ID del perfil
                        </label>

                        <input
                            type="number"
                            id="actualizarIdPerfil"
                            min="1"
                            placeholder="Ingrese el ID del perfil"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="actualizarNombreUsuario">
                            Nombre de usuario
                        </label>

                        <input
                            type="text"
                            id="actualizarNombreUsuario"
                            maxlength="100"
                            placeholder="Nombre de usuario"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="actualizarFotoPerfil">
                            Foto de perfil
                        </label>

                        <input
                            type="text"
                            id="actualizarFotoPerfil"
                            maxlength="300"
                            placeholder="URL de la imagen"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="actualizarTelefono">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="actualizarTelefono"
                            maxlength="20"
                            placeholder="Ejemplo: 3001234567"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="actualizarCiudad">
                            Ciudad
                        </label>

                        <input
                            type="text"
                            id="actualizarCiudad"
                            maxlength="100"
                            placeholder="Ejemplo: Medellín"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="actualizarGenero">
                            Género
                        </label>

                        <select
                            id="actualizarGenero"
                            required
                        >

                            <option value="">
                                Seleccione una opción
                            </option>

                            <option value="Masculino">
                                Masculino
                            </option>

                            <option value="Femenino">
                                Femenino
                            </option>

                            <option value="Otro">
                                Otro
                            </option>

                            <option value="Prefiero no decirlo">
                                Prefiero no decirlo
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="actualizarFechaNacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="actualizarFechaNacimiento"
                            required
                        >

                    </div>


                    <div class="campo completo">

                        <label for="actualizarBiografia">
                            Biografía
                        </label>

                        <textarea
                            id="actualizarBiografia"
                            maxlength="300"
                            placeholder="Escriba la nueva biografía..."
                            required
                        ></textarea>

                    </div>


                    <div class="botones">

                        <button
                            type="submit"
                            class="btn-actualizar"
                        >
                             Actualizar perfil
                        </button>


                        <button
                            type="button"
                            class="btn-limpiar"
                            onclick="limpiarActualizar()"
                        >
                            Limpiar
                        </button>

                    </div>

                </form>


                <p
                    id="mensajeActualizar"
                    class="mensaje"
                ></p>

            </div>

        </section>



        <!-- =====================================================
             ELIMINAR PERFIL
        ====================================================== -->

        <section class="seccion">

            <div class="tabla-perfil">

                <h2 class="tabla-titulo">
                    Eliminar perfil de usuario
                </h2>


                <form
                    id="formEliminarPerfil"
                    class="formulario"
                >


                    <div class="campo">

                        <label for="eliminarIdPerfil">
                            ID del perfil
                        </label>

                        <input
                            type="number"
                            id="eliminarIdPerfil"
                            min="1"
                            placeholder="Ingrese el ID del perfil"
                            required
                        >

                    </div>


                    <div class="botones">

                        <button
                            type="submit"
                            class="btn-eliminar"
                        >
                            Eliminar perfil
                        </button>


                        <button
                            type="button"
                            class="btn-limpiar"
                            onclick="limpiarEliminar()"
                        >
                            Limpiar
                        </button>

                    </div>

                </form>


                <p
                    id="mensajeEliminar"
                    class="mensaje"
                ></p>

            </div>

        </section>


    </div>


    <!-- =====================================================
         PIE DE PAGINA
    ====================================================== -->

    <div class="pie">

        My Pet © 2026 · Gestión de perfil de usuario 🐾

    </div>


</div>



<script>


// =====================================================
// URL DEL API
// =====================================================

const URL_API =
    "http://localhost:8082/api/perfiles";



// =====================================================
// MOSTRAR MENSAJES
// =====================================================

function mostrarMensaje(elemento, texto, tipo) {

    elemento.textContent = texto;

    elemento.className =
        "mensaje " + tipo;

}



// =====================================================
// CREAR PERFIL - POST
// =====================================================

document
    .getElementById("formCrearPerfil")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const idUsuario =
            parseInt(
                document.getElementById(
                    "crearIdUsuario"
                ).value
            );


        const perfil = {

            usuario: {

                idUsuario: idUsuario

            },

            nombreUsuario:
                document.getElementById(
                    "crearNombreUsuario"
                ).value,

            fotoPerfil:
                document.getElementById(
                    "crearFotoPerfil"
                ).value,

            biografia:
                document.getElementById(
                    "crearBiografia"
                ).value,

            telefono:
                document.getElementById(
                    "crearTelefono"
                ).value,

            ciudad:
                document.getElementById(
                    "crearCiudad"
                ).value,

            genero:
                document.getElementById(
                    "crearGenero"
                ).value,

            fechaNacimiento:
                document.getElementById(
                    "crearFechaNacimiento"
                ).value

        };


        fetch(
            URL_API + "/crear",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(perfil)

            }
        )

        .then(async response => {

            if (!response.ok) {

                const texto =
                    await response.text();

                throw new Error(
                    texto ||
                    "No fue posible crear el perfil"
                );

            }

            return response.json();

        })

        .then(data => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeCrear"
                ),

                "Perfil creado correctamente.",

                "exito"

            );


            document
                .getElementById(
                    "formCrearPerfil"
                )
                .reset();


            listarPerfiles();

        })

        .catch(error => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeCrear"
                ),

                "Error: " + error.message,

                "error"

            );

        });

    });



// =====================================================
// LISTAR TODOS - GET
// =====================================================

function listarPerfiles() {

    fetch(URL_API + "/listar")

        .then(async response => {

            if (!response.ok) {

                const texto =
                    await response.text();

                throw new Error(
                    texto ||
                    "No fue posible obtener los perfiles"
                );

            }

            return response.json();

        })

        .then(perfiles => {

            const contenedor =
                document.getElementById(
                    "contenedorLista"
                );


            if (!perfiles || perfiles.length === 0) {

                contenedor.innerHTML = `

                    <p style="
                        padding: 20px;
                        text-align: center;
                        color: #777;
                    ">
                        No existen perfiles registrados.
                    </p>

                `;

                return;

            }


            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>ID Perfil</th>
                            <th>ID Usuario</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Ciudad</th>
                            <th>Género</th>
                            <th>Fecha nacimiento</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            perfiles.forEach(perfil => {

                let idUsuario = "";

                if (perfil.usuario) {

                    idUsuario =
                        perfil.usuario.idUsuario ?? "";

                }


                html += `

                    <tr>

                        <td>
                            ${perfil.idPerfil ?? ""}
                        </td>

                        <td>
                            ${idUsuario}
                        </td>

                        <td>
                            ${perfil.nombreUsuario ?? ""}
                        </td>

                        <td>
                            ${perfil.telefono ?? ""}
                        </td>

                        <td>
                            ${perfil.ciudad ?? ""}
                        </td>

                        <td>
                            ${perfil.genero ?? ""}
                        </td>

                        <td>
                            ${perfil.fechaNacimiento ?? ""}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            contenedor.innerHTML = html;

        })

        .catch(error => {

            document.getElementById(
                "contenedorLista"
            ).innerHTML = `

                <div class="mensaje error"
                     style="display:block;">

                    Error: ${error.message}

                </div>

            `;

        });

}



// =====================================================
// BUSCAR POR ID - GET
// =====================================================

document
    .getElementById("formBuscarPerfil")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                "buscarIdPerfil"
            ).value;


        fetch(
            URL_API + "/" + id
        )

        .then(async response => {

            if (!response.ok) {

                const texto =
                    await response.text();

                throw new Error(
                    texto ||
                    "El perfil no existe"
                );

            }

            return response.json();

        })

        .then(perfil => {

            const resultado =
                document.getElementById(
                    "resultadoPerfil"
                );


            let idUsuario = "";

            if (perfil.usuario) {

                idUsuario =
                    perfil.usuario.idUsuario ?? "";

            }


            resultado.innerHTML = `

                <div class="tarjeta-resultado">

                    <h3>
                        🐾 Perfil encontrado
                    </h3>

                    <p class="dato">
                        <strong>ID del perfil:</strong>
                        ${perfil.idPerfil ?? ""}
                    </p>

                    <p class="dato">
                        <strong>ID del usuario:</strong>
                        ${idUsuario}
                    </p>

                    <p class="dato">
                        <strong>Nombre:</strong>
                        ${perfil.nombreUsuario ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Foto:</strong>
                        ${perfil.fotoPerfil ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Teléfono:</strong>
                        ${perfil.telefono ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Ciudad:</strong>
                        ${perfil.ciudad ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Género:</strong>
                        ${perfil.genero ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Fecha de nacimiento:</strong>
                        ${perfil.fechaNacimiento ?? ""}
                    </p>

                    <p class="dato">
                        <strong>Biografía:</strong>
                        ${perfil.biografia ?? ""}
                    </p>

                </div>

            `;

        })

        .catch(error => {

            document.getElementById(
                "resultadoPerfil"
            ).innerHTML = `

                <div
                    class="mensaje error"
                    style="display:block;"
                >
                    ${error.message}
                </div>

            `;

        });

    });



// =====================================================
// ACTUALIZAR PERFIL - PUT
// =====================================================

document
    .getElementById("formActualizarPerfil")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                "actualizarIdPerfil"
            ).value;


        const perfil = {

            nombreUsuario:
                document.getElementById(
                    "actualizarNombreUsuario"
                ).value,

            fotoPerfil:
                document.getElementById(
                    "actualizarFotoPerfil"
                ).value,

            biografia:
                document.getElementById(
                    "actualizarBiografia"
                ).value,

            telefono:
                document.getElementById(
                    "actualizarTelefono"
                ).value,

            ciudad:
                document.getElementById(
                    "actualizarCiudad"
                ).value,

            genero:
                document.getElementById(
                    "actualizarGenero"
                ).value,

            fechaNacimiento:
                document.getElementById(
                    "actualizarFechaNacimiento"
                ).value

        };


        fetch(
            URL_API + "/actualizar/" + id,
            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(perfil)

            }
        )

        .then(async response => {

            if (!response.ok) {

                const texto =
                    await response.text();

                throw new Error(
                    texto ||
                    "No fue posible actualizar el perfil"
                );

            }

            return response.json();

        })

        .then(data => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeActualizar"
                ),

                "Perfil actualizado correctamente.",

                "exito"

            );


            listarPerfiles();

        })

        .catch(error => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeActualizar"
                ),

                "Error: " + error.message,

                "error"

            );

        });

    });



// =====================================================
// ELIMINAR PERFIL - DELETE
// =====================================================

document
    .getElementById("formEliminarPerfil")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                "eliminarIdPerfil"
            ).value;


        const confirmar =
            confirm(
                "¿Está seguro de que desea eliminar este perfil?"
            );


        if (!confirmar) {

            return;

        }


        fetch(
            URL_API + "/eliminar/" + id,
            {

                method: "DELETE"

            }
        )

        .then(async response => {

            if (!response.ok) {

                const texto =
                    await response.text();

                throw new Error(
                    texto ||
                    "No fue posible eliminar el perfil"
                );

            }


            return response.text();

        })

        .then(data => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeEliminar"
                ),

                "Perfil eliminado correctamente.",

                "exito"

            );


            document
                .getElementById(
                    "formEliminarPerfil"
                )
                .reset();


            listarPerfiles();

        })

        .catch(error => {

            mostrarMensaje(

                document.getElementById(
                    "mensajeEliminar"
                ),

                "Error: " + error.message,

                "error"

            );

        });

    });
